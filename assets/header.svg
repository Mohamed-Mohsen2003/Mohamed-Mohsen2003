<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Mohamed Mohsen — Full-Stack Developer and UI/UX Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c9cdb"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <style>
      .title { font: 700 54px 'Segoe UI', Poppins, Helvetica, Arial, sans-serif; fill: #ffffff; opacity: 0; animation: rise 1s ease-out .2s forwards; }
      .sub { font: 500 20px 'Segoe UI', Poppins, Helvetica, Arial, sans-serif; fill: #cfe8f7; letter-spacing: 3px; opacity: 0; animation: rise 1s ease-out .7s forwards; }
      .bar { transform-origin: 500px 0; transform: scaleX(0); animation: grow 1s ease-out 1.1s forwards; }
      .wave1 { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .dot { animation: float 6s ease-in-out infinite; }
      .dot2 { animation: float 8s ease-in-out infinite reverse; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
    </style>
  </defs>
  <rect width="1000" height="220" rx="18" fill="url(#bg)"/>
  <g opacity="0.18" fill="#7dd3fc">
    <path class="wave1" d="M0 170 C 150 140, 300 200, 450 170 S 750 140, 900 170 S 1100 200, 1100 170 V220 H0 Z"/>
    <path class="wave2" d="M0 185 C 180 160, 320 215, 500 185 S 800 160, 960 190 S 1100 210, 1100 190 V220 H0 Z" opacity="0.7"/>
  </g>
  <circle class="dot" cx="90" cy="60" r="5" fill="#7dd3fc" opacity="0.6"/>
  <circle class="dot2" cx="910" cy="50" r="7" fill="#2c9cdb" opacity="0.6"/>
  <circle class="dot" cx="850" cy="140" r="4" fill="#ffffff" opacity="0.35"/>
  <circle class="dot2" cx="150" cy="150" r="4" fill="#ffffff" opacity="0.3"/>
  <text class="title" x="500" y="98" text-anchor="middle">Mohamed Mohsen</text>
  <rect class="bar" x="420" y="114" width="160" height="4" rx="2" fill="url(#accent)"/>
  <text class="sub" x="500" y="150" text-anchor="middle">FULL-STACK DEVELOPER · UI/UX DESIGNER</text>
</svg>
